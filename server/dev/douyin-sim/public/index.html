<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>抖音 · 仿真演示环境</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #161823; color: #fff; font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 10; background: rgba(22,24,35,.92); backdrop-filter: blur(8px); border-bottom: 1px solid #2b2d3a; padding: 14px 32px; display: flex; align-items: center; gap: 22px; }
  .logo { font-size: 21px; font-weight: 900; color: #fe2c55; letter-spacing: 1px; white-space: nowrap; }
  .logo span { color: #fff; font-size: 12px; font-weight: 500; margin-left: 8px; color: #8a8fa3; }
  .search-bar { flex: 1; max-width: 520px; display: flex; }
  #kw { flex: 1; background: #252736; border: 1px solid #323546; border-right: none; border-radius: 8px 0 0 8px; padding: 10px 16px; color: #fff; font-size: 14px; outline: none; }
  #kw:focus { border-color: #fe2c55; }
  #search-btn { background: #fe2c55; color: #fff; border: none; border-radius: 0 8px 8px 0; padding: 0 22px; font-size: 14px; font-weight: 700; cursor: pointer; }
  .hint { font-size: 12px; color: #8a8fa3; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 60px; }
  .page-title { font-size: 18px; font-weight: 700; margin-bottom: 18px; }
  .page-title em { color: #fe2c55; font-style: normal; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
  .video-card { background: #1f2130; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform .15s, box-shadow .15s; border: 1px solid #2b2d3a; }
  .video-card:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(254,44,85,.18); }
  .cover { height: 130px; position: relative; overflow: hidden; }
  .cover i { position: absolute; inset: 0; opacity: .9; }
  .cover .play { position: absolute; right: 10px; bottom: 8px; background: rgba(0,0,0,.5); border-radius: 12px; padding: 2px 10px; font-size: 12px; }
  .v-body { padding: 12px 14px 14px; }
  .v-title { font-size: 14px; font-weight: 600; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 42px; }
  .v-meta { margin-top: 10px; font-size: 12px; color: #8a8fa3; display: flex; gap: 14px; }
  .v-meta b { color: #c9cbD8; font-weight: 500; }
  /* 视频详情 */
  .back { background: none; border: none; color: #fe2c55; font-size: 14px; cursor: pointer; margin-bottom: 16px; font-weight: 600; }
  .video-head { display: flex; gap: 20px; background: #1f2130; border-radius: 14px; padding: 20px; border: 1px solid #2b2d3a; }
  .video-head .cover { width: 280px; height: 160px; border-radius: 10px; flex-shrink: 0; }
  .v-info h2 { font-size: 18px; margin-bottom: 8px; }
  .v-info .author { color: #fe2c55; font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .v-info .stats { font-size: 13px; color: #8a8fa3; }
  .cmt-title { font-size: 15px; font-weight: 700; margin: 26px 0 14px; }
  .cmt-title span { color: #8a8fa3; font-weight: 400; font-size: 13px; margin-left: 6px; }
  .comment-item { display: flex; gap: 12px; padding: 13px 0; border-bottom: 1px solid #262838; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; font-weight: 700; }
  .cmt-main { flex: 1; }
  .cmt-nick { font-size: 13px; color: #8a8fa3; margin-bottom: 4px; }
  .cmt-text { font-size: 14.5px; line-height: 1.55; }
  .cmt-likes { font-size: 12px; color: #8a8fa3; margin-top: 6px; }
  .empty { text-align: center; color: #8a8fa3; padding: 80px 0; font-size: 14px; }
</style>
</head>
<body>
<header>
  <div class="logo">抖音<span>仿真演示环境 · 本地页面 · 非真实平台</span></div>
  <div class="search-bar">
    <input id="kw" placeholder="搜索你感兴趣的视频" />
    <button id="search-btn">搜索</button>
  </div>
  <div class="hint">共 <b id="total-v">0</b> 条视频</div>
</header>

<main id="app"><div class="empty">加载中…</div></main>

<script>
let DATA = { videos: [] }
let keyword = ''
const COLORS = ['#5b5bd6','#d6455b','#1d9e75','#e8833a','#7f77dd','#993556','#185fa5','#854f0b']
const $ = (s) => document.querySelector(s)

function colorOf(nick){ let h=0; for(let i=0;i<nick.length;i++) h=(h*31+nick.charCodeAt(i))>>>0; return COLORS[h%COLORS.length] }
function fmt(n){ return n>=10000 ? (n/10000).toFixed(1)+'w' : String(n) }
function grad(seed){ const h=(seed*47)%360; return `linear-gradient(135deg,hsl(${h},55%,38%),hsl(${(h+60)%360},50%,26%))` }

function grams(s){ const out=[]; const t=s.toLowerCase(); for(let i=0;i<t.length-1;i++) out.push(t.slice(i,i+2)); return out }
function matchVideo(v, kw){
  if(!kw) return true
  kw = kw.toLowerCase()
  const hay = [v.title, v.author, ...v.kws].join(' ').toLowerCase()
  if(hay.includes(kw)) return true
  // 整词包含：只接受 3 字以上的行业词，避免「加盟」「价格」这类通用词把别的行业视频串进来
  if(v.kws.some(k=>{
    const kk = k.toLowerCase()
    return kk.length >= 3 && (kw.includes(kk) || kk.includes(kw))
  })) return true
  // 模糊匹配：至少 2 个二字片段命中（"洱海旅拍" 能搜到洱海相关视频）
  return grams(kw).filter(g => hay.includes(g)).length >= 2
}

function renderList(){
  const list = DATA.videos.filter(v=>matchVideo(v, keyword))
  $('#total-v').textContent = list.length
  $('#app').innerHTML = `
    <div class="page-title">搜索「<em>${keyword || '全部'}</em>」· 找到 ${list.length} 条视频</div>
    <div class="grid">${list.map((v,i)=>`
      <div class="video-card" data-vid="${v.id}" data-title="${v.title}" data-author="${v.author}"
           data-likes="${v.likes}" data-cmts="${v.cmts}" data-href="#/video/${v.id}" role="button">
        <div class="cover" style="background:${grad(i+3)}"><div class="play">▶ ${fmt(v.likes)}</div></div>
        <div class="v-body">
          <div class="v-title">${v.title}</div>
          <div class="v-meta"><span>@${v.author}</span><span>💬 <b>${v.cmts}</b></span></div>
        </div>
      </div>`).join('') || '<div class="empty">没有匹配的视频</div>'}
    </div>`
  document.querySelectorAll('.video-card').forEach(el =>
    el.addEventListener('click', () => { location.hash = el.dataset.href }))
}

function renderDetail(vid){
  const v = DATA.videos.find(x=>x.id===vid)
  if(!v){ location.hash=''; return }
  $('#app').innerHTML = `
    <button class="back" id="back-btn">← 返回搜索结果</button>
    <div class="video-head">
      <div class="cover" style="background:${grad(v.id.length+5)}"></div>
      <div class="v-info">
        <h2>${v.title}</h2>
        <div class="author">@${v.author}</div>
        <div class="stats">点赞 ${fmt(v.likes)} · 评论 ${v.cmts} · 分享 1.2w</div>
      </div>
    </div>
    <div class="cmt-title">全部评论 <span>${v.comments.length} 条</span></div>
    <div id="cmt-list">
      ${v.comments.map(c=>`
        <div class="comment-item" data-cid="${c.cid}" data-nick="${c.nick}" data-text="${c.text.replace(/"/g,'&quot;')}" data-likes="${c.likes}">
          <div class="avatar" style="background:${colorOf(c.nick)}">${c.nick.slice(0,1)}</div>
          <div class="cmt-main">
            <div class="cmt-nick">${c.nick}</div>
            <div class="cmt-text">${c.text}</div>
            <div class="cmt-likes">❤ ${c.likes} · 回复</div>
          </div>
        </div>`).join('')}
    </div>`
  $('#back-btn').addEventListener('click', ()=>{ location.hash = '' })
}

function route(){
  const m = location.hash.match(/^#\/video\/(.+)$/)
  m ? renderDetail(m[1]) : renderList()
}

async function boot(){
  const res = await fetch('/sim/data')
  DATA = await res.json()
  window.addEventListener('hashchange', route)
  $('#search-btn').addEventListener('click', ()=>{ keyword = $('#kw').value.trim(); route() })
  $('#kw').addEventListener('keydown', e=>{ if(e.key==='Enter'){ keyword = $('#kw').value.trim(); route() } })
  route()
}
boot()
</script>
</body>
</html>

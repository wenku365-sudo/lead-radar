# Render Dashboard -> New -> Blueprint -> select this repository.
services:
  - type: web
    name: lead-radar-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: lead-radar-data
      mountPath: /var/data/lead-radar
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 24.22.1
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: LR_DATA_DIR
        value: /var/data/lead-radar
      - key: LR_SEED_DEMO
        value: 'false'
      - key: LR_COLLECTOR
        value: mock
